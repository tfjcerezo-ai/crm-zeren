<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Zeren Clinics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --sage:#6B8F71;
    --sage-deep:#3F5442;
    --sage-darker:#2C3B2E;
    --cream:#D4C9B8;
    --paper:#FAF8F4;
    --ink:#2B2E2A;
    --ink-soft:#5C6259;
    --line:#E4DFD4;
    --terracotta:#B0776B;
    --amber:#E3A857;

    --st-nuevo:#A8B4AC;
    --st-nocontesta:#E3A857;
    --st-contactado:#7C97A3;
    --st-propuesta:#D4B483;
    --st-seguimiento:#D98E4A;
    --st-cita:#9CB6A0;
    --st-cierre:#6B8F71;
    --st-ganado:#4A7856;
    --st-perdido:#B0776B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Fraunces',Georgia,serif;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%, #7DA083 0%, var(--sage) 45%, var(--sage-deep) 100%);
    padding:32px 20px;
  }
  .login-logo{width:min(280px,60vw);margin-bottom:40px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.18));}
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--paper);
    border-radius:4px;
    padding:40px 36px 32px;
    box-shadow:0 24px 60px -20px rgba(20,30,20,.45);
  }
  .login-card h2{
    margin:0 0 6px;
    font-size:26px;
    font-weight:500;
    color:var(--sage-darker);
  }
  .login-card p.sub{
    margin:0 0 28px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:.01em;
  }
  .field input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:15px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--sage);
    box-shadow:0 0 0 3px rgba(107,143,113,.18);
  }
  .btn-primary{
    width:100%;
    padding:12px;
    border:none;
    border-radius:3px;
    background:var(--sage-deep);
    color:var(--cream);
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-primary:hover{background:var(--sage-darker);}
  .demo-note{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .demo-note button{
    background:none;border:none;padding:0;
    color:var(--sage-deep);text-decoration:underline;
    cursor:pointer;font-size:12.5px;font-family:inherit;
  }
  .login-footer{
    margin-top:32px;
    color:rgba(255,255,255,.75);
    font-size:12.5px;
    text-align:center;
  }
  .login-footer a{color:#fff;}

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none; min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;
    flex-shrink:0;
    background:var(--sage-darker);
    color:var(--cream);
    display:flex;
    flex-direction:column;
    padding:26px 16px;
  }
  .sidebar .brand-mark{
    display:flex;align-items:center;gap:10px;
    padding:0 8px 24px;
    border-bottom:1px solid rgba(212,201,184,.18);
    margin-bottom:18px;
  }
  .sidebar .brand-mark img{width:30px;height:30px;object-fit:contain;filter:brightness(0) invert(1);opacity:.92;}
  .sidebar .brand-mark span{font-family:'Fraunces';font-size:17px;letter-spacing:.02em;color:#fff;}
  nav.menu{flex:1;display:flex;flex-direction:column;gap:2px;}
  nav.menu button{
    display:flex;align-items:center;gap:11px;
    text-align:left;
    padding:10px 12px;
    border:none;background:none;
    color:rgba(212,201,184,.82);
    font-family:inherit;font-size:14.5px;
    border-radius:5px;cursor:pointer;
  }
  nav.menu button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}
  nav.menu button:hover{background:rgba(212,201,184,.08);color:#fff;}
  nav.menu button.active{background:var(--cream);color:var(--sage-darker);font-weight:600;}
  nav.menu button.active .dot{background:var(--sage-darker);opacity:1;}
  .sidebar .user-box{
    border-top:1px solid rgba(212,201,184,.18);
    padding-top:16px;margin-top:10px;
  }
  .user-box .who{font-size:13.5px;color:#fff;margin-bottom:2px;}
  .user-box .role{font-size:12px;color:rgba(212,201,184,.7);margin-bottom:12px;}
  .user-box button{
    width:100%;padding:8px;border:1px solid rgba(212,201,184,.3);
    background:none;color:var(--cream);border-radius:4px;
    font-family:inherit;font-size:13px;cursor:pointer;
  }
  .user-box button:hover{background:rgba(212,201,184,.1);}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    padding:22px 36px 18px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;
  }
  .topbar h1{margin:0;font-size:23px;font-weight:500;color:var(--sage-darker);}
  .topbar .date{font-size:13px;color:var(--ink-soft);}
  .content{padding:28px 36px 40px;flex:1;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;}
  .kpi{
    background:#fff;border:1px solid var(--line);border-left:3px solid var(--sage);
    border-radius:4px;padding:16px 18px;
  }
  .kpi.c2{border-left-color:var(--st-seguimiento);}
  .kpi.c3{border-left-color:var(--st-ganado);}
  .kpi.c4{border-left-color:var(--terracotta);}
  .kpi .num{font-family:'Fraunces';font-size:28px;color:var(--sage-darker);line-height:1;}
  .kpi .label{margin-top:6px;font-size:13px;color:var(--ink-soft);}

  .panel{
    background:#fff;border:1px solid var(--line);border-radius:4px;
    padding:22px 24px;margin-bottom:20px;
  }
  .panel h3{margin:0 0 16px;font-size:16px;font-weight:600;color:var(--sage-darker);}
  .panel.placeholder{
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    color:var(--ink-soft);font-size:14px;
  }
  .panel.placeholder .tag{
    font-size:11.5px;color:var(--sage-deep);background:rgba(107,143,113,.12);
    padding:3px 9px;border-radius:20px;margin-bottom:6px;
  }

  .pipeline-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .stage-col{min-width:150px;flex-shrink:0;}
  .stage-head{
    font-size:12px;font-weight:600;color:#fff;
    padding:6px 10px;border-radius:3px 3px 0 0;
  }
  .stage-body{
    background:#fbfaf7;border:1px solid var(--line);border-top:none;
    border-radius:0 0 3px 3px;min-height:64px;padding:8px;
    font-size:12px;color:var(--ink-soft);
  }
  .lead-card{
    background:#fff;border:1px solid var(--line);border-radius:3px;
    padding:7px 9px;margin-bottom:6px;font-size:12.5px;color:var(--ink);
  }

  .foot{
    padding:14px 36px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-soft);
    display:flex;justify-content:space-between;
  }
  .foot a{color:var(--sage-deep);text-decoration:none;}

  @media (max-width:820px){
    .sidebar{position:fixed;left:-236px;top:0;bottom:0;z-index:20;transition:left .2s;}
    .sidebar.open{left:0;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .content{padding:20px;}
    .topbar{padding:18px 20px;}
  }
</style>
</head>

<script>
const SUPABASE_URL = 'https://rlffvquhwaeduinnzuwk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Md-7y2DpPlvkrAQ5nQhE_Q_tL9jAhlh';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STAGES = [
  ['contacto_nuevo','Contacto nuevo','var(--st-nuevo)'],
  ['no_contesta','No contesta','var(--st-nocontesta)'],
  ['contactado','Contactado','var(--st-contactado)'],
  ['propuesta_enviada','Propuesta enviada','var(--st-propuesta)'],
  ['hacer_seguimiento','Hacer seguimiento','var(--st-seguimiento)'],
  ['cita','Cita','var(--st-cita)'],
  ['cierre','Cierre','var(--st-cierre)'],
  ['cerrado_ganado','Cerrado ganado','var(--st-ganado)'],
  ['cerrado_perdido','Cerrado perdido','var(--st-perdido)']
];
const LABELS = {
  dashboard:'Dashboard', contactos:'Contactos', pipeline:'Pipeline',
  calendario:'Calendario', equipo:'Equipo & Finanzas', config:'Configuración'
};

let currentUser = null; // fila completa de la tabla usuarios

function sectionsForUser(u){
  if(u.rol === 'admin') return ['dashboard','contactos','pipeline','calendario','equipo','config'];
  if(u.rol === 'medico') return u.es_gerente ? ['dashboard','contactos','pipeline','calendario'] : ['calendario'];
  // closer
  return ['dashboard','contactos','pipeline','calendario'];
}

function ve_todo(u){
  // admin, coordinador (closer+es_coordinador) y médico-gerente ven todo el equipo
  return u.rol === 'admin' || (u.rol === 'closer' && u.es_coordinador) || (u.rol === 'medico' && u.es_gerente);
}

async function login(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('pass').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  if(!email || !pass){
    errBox.textContent = 'Introduce correo y contraseña.';
    errBox.style.display = 'block';
    return;
  }
  const { data, error } = await sb.from('usuarios').select('*').eq('email', email).eq('clave', pass).eq('activo', true).maybeSingle();
  if(error){
    errBox.textContent = 'Error de conexión con la base de datos: ' + error.message;
    errBox.style.display = 'block';
    return;
  }
  if(!data){
    errBox.textContent = 'Correo o contraseña incorrectos.';
    errBox.style.display = 'block';
    return;
  }
  currentUser = data;
  localStorage.setItem('zeren_session', JSON.stringify({ id: data.id }));
  showApp();
}

async function checkSavedSession(){
  const raw = localStorage.getItem('zeren_session');
  if(!raw) return;
  try{
    const saved = JSON.parse(raw);
    const { data, error } = await sb.from('usuarios').select('*').eq('id', saved.id).eq('activo', true).maybeSingle();
    if(error || !data){ localStorage.removeItem('zeren_session'); return; }
    currentUser = data;
    showApp();
  }catch(e){
    localStorage.removeItem('zeren_session');
  }
}
checkSavedSession();

function roleLabel(u){
  if(u.rol === 'admin') return 'Administrador — visión completa';
  if(u.rol === 'medico') return u.es_gerente ? 'Médico · Gerente' : 'Médico';
  return u.es_coordinador ? 'Closer · Coordinador/a' : 'Closer';
}

function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('who').textContent = currentUser.nombre;
  document.getElementById('role').textContent = roleLabel(currentUser);
  document.getElementById('date-label').textContent = new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
  buildMenu();
  renderSection(sectionsForUser(currentUser)[0]);
}

function buildMenu(){
  const menu = document.getElementById('menu');
  menu.innerHTML = '';
  sectionsForUser(currentUser).forEach(key=>{
    const b = document.createElement('button');
    b.innerHTML = '<span class="dot"></span>' + LABELS[key];
    b.onclick = ()=>renderSection(key);
    b.id = 'nav-'+key;
    menu.appendChild(b);
  });
}

async function renderSection(key){
  document.querySelectorAll('nav.menu button').forEach(b=>b.classList.remove('active'));
  const active = document.getElementById('nav-'+key);
  if(active) active.classList.add('active');
  document.getElementById('section-title').textContent = LABELS[key];
  const content = document.getElementById('content');
  content.innerHTML = '<div class="panel placeholder"><span class="tag">Cargando…</span></div>';
  try{
    if(key === 'dashboard'){ content.innerHTML = await renderDashboard(); initDashboardCharts(); }
    else if(key === 'pipeline') content.innerHTML = await renderPipeline();
    else if(key === 'contactos') content.innerHTML = await renderContactos();
    else if(key === 'equipo') content.innerHTML = await renderEquipo();
    else if(key === 'calendario') content.innerHTML = await renderCalendario();
    else if(key === 'config') content.innerHTML = await renderConfig();
    else content.innerHTML = placeholder(key);
  }catch(e){
    content.innerHTML = `<div class="panel placeholder"><span class="tag">Error</span><div>${e.message}</div></div>`;
  }
}

function placeholder(key){
  return `<div class="panel placeholder">
    <span class="tag">En construcción</span>
    <div>La sección "${LABELS[key]}" se conectará en un siguiente paso.</div>
  </div>`;
}

// ---------- DASHBOARD ----------
async function renderDashboard(){
  const soyCloser = currentUser.rol === 'closer' && !ve_todo(currentUser);
  let contactosQ = sb.from('contactos').select('*', {count:'exact', head:true}).eq('estado','activo');
  if(soyCloser) contactosQ = contactosQ.eq('closer_id', currentUser.id);
  const { count: leadsActivos } = await contactosQ;

  let pipelineQ = sb.from('pipeline').select('*, contactos!inner(closer_id)', {count:'exact', head:true}).eq('etapa','hacer_seguimiento');
  if(soyCloser) pipelineQ = pipelineQ.eq('contactos.closer_id', currentUser.id);
  const { count: enSeguimiento } = await pipelineQ;

  const inicioMes = new Date(); inicioMes.setDate(1); inicioMes.setHours(0,0,0,0);
  let ganadosQ = sb.from('pipeline').select('*, contactos!inner(closer_id)', {count:'exact', head:true}).eq('etapa','cerrado_ganado').gte('fecha_cambio_etapa', inicioMes.toISOString());
  if(soyCloser) ganadosQ = ganadosQ.eq('contactos.closer_id', currentUser.id);
  const { count: cerradosMes } = await ganadosQ;

  let comisionesQ = sb.from('comisiones').select('monto_closer, monto_cdv, closer_id').eq('estado_pago','pendiente');
  if(soyCloser) comisionesQ = comisionesQ.eq('closer_id', currentUser.id);
  const { data: comisiones } = await comisionesQ;
  const totalComisiones = (comisiones||[]).reduce((s,c)=> s + Number(soyCloser ? c.monto_closer : c.monto_cdv || 0), 0);

  const pipelineHtml = await pipelineBoardHtml();

  // ---- datos para los gráficos de ventas ----
  let ventasQ = sb.from('comisiones').select('venta_valor, fecha_venta, closer_id');
  if(soyCloser) ventasQ = ventasQ.eq('closer_id', currentUser.id);
  const { data: ventas } = await ventasQ;

  const hoy = new Date();
  const anioActual = hoy.getFullYear();
  const mesesLabel = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  const porMesAnioActual = new Array(12).fill(0);
  const anios = new Set();
  (ventas||[]).forEach(v=>{
    const f = new Date(v.fecha_venta);
    anios.add(f.getFullYear());
    if(f.getFullYear() === anioActual) porMesAnioActual[f.getMonth()] += Number(v.venta_valor||0);
  });
  anios.add(anioActual);
  const aniosOrdenados = Array.from(anios).sort().slice(-3); // hasta 3 años más recientes

  const porAnio = {};
  aniosOrdenados.forEach(a => porAnio[a] = new Array(12).fill(0));
  (ventas||[]).forEach(v=>{
    const f = new Date(v.fecha_venta);
    if(porAnio[f.getFullYear()]) porAnio[f.getFullYear()][f.getMonth()] += Number(v.venta_valor||0);
  });

  window._dashboardChartData = { mesesLabel, porMesAnioActual, anioActual, porAnio, aniosOrdenados };

  const solicitudesHtml = currentUser.rol === 'admin' ? await renderSolicitudesPendientes() : '';

  return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${leadsActivos ?? 0}</div><div class="label">Leads activos</div></div>
      <div class="kpi c2"><div class="num">${enSeguimiento ?? 0}</div><div class="label">En seguimiento</div></div>
      <div class="kpi c3"><div class="num">${cerradosMes ?? 0}</div><div class="label">Cerrados este mes</div></div>
      <div class="kpi c4"><div class="num">${totalComisiones.toLocaleString('es-ES',{style:'currency',currency:'EUR'})}</div><div class="label">Comisiones pendientes</div></div>
    </div>

    ${solicitudesHtml}

    <div class="panel">
      <h3>Ventas por mes — ${anioActual}</h3>
      <div style="height:240px;"><canvas id="chart-mes"></canvas></div>
    </div>

    <div class="panel">
      <h3>Comparativa por años</h3>
      <div style="height:240px;"><canvas id="chart-anios"></canvas></div>
    </div>

    <div class="panel">
      <h3>Pipeline — vista rápida</h3>
      ${pipelineHtml}
    </div>
  `;
}

async function renderSolicitudesPendientes(){
  const { data, error } = await sb.from('solicitudes_reasignacion')
    .select('id, motivo, fecha_solicitud, contactos(nombre), origen:usuarios!solicitudes_reasignacion_closer_origen_id_fkey(nombre), destino:usuarios!solicitudes_reasignacion_closer_destino_id_fkey(nombre), propuesto:usuarios!solicitudes_reasignacion_propuesto_por_fkey(nombre)')
    .eq('estado', 'pendiente')
    .order('fecha_solicitud', {ascending:false});
  if(error || !data || data.length === 0) return '';

  const filas = data.map(s => `
    <div style="border-left:3px solid var(--amber);padding:10px 14px;background:#FDF8EF;border-radius:0 3px 3px 0;margin-bottom:8px;">
      <div style="font-size:13.5px;"><strong>${s.contactos ? s.contactos.nombre : '—'}</strong>: ${s.origen ? s.origen.nombre : '—'} → ${s.destino ? s.destino.nombre : '—'}</div>
      ${s.motivo ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">${s.motivo}</div>` : ''}
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">Propuesto por ${s.propuesto ? s.propuesto.nombre : '—'} · ${new Date(s.fecha_solicitud).toLocaleString('es-ES')}</div>
      <div style="margin-top:8px;display:flex;gap:8px;">
        <button onclick="resolverSolicitud('${s.id}','aprobado')" style="font-size:12px;padding:5px 12px;border:1px solid var(--sage-deep);color:var(--sage-deep);border-radius:3px;background:#fff;cursor:pointer;">Aprobar</button>
        <button onclick="resolverSolicitud('${s.id}','rechazado')" style="font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;">Rechazar</button>
      </div>
    </div>`).join('');

  return `<div class="panel">
    <h3>Solicitudes de reasignación pendientes (${data.length})</h3>

async function resolverSolicitud(id, decision){
  const { data: sol, error: e0 } = await sb.from('solicitudes_reasignacion').select('*').eq('id', id).maybeSingle();
  if(e0 || !sol){ alert('No se pudo cargar la solicitud.'); return; }

  const { error: e1 } = await sb.from('solicitudes_reasignacion').update({
    estado: decision, resuelto_por: currentUser.id, fecha_resolucion: new Date().toISOString()
  }).eq('id', id);
  if(e1){ alert('Error: ' + e1.message); return; }

  if(decision === 'aprobado'){
    await sb.from('contactos').update({ closer_id: sol.closer_destino_id }).eq('id', sol.contacto_id);
    const { data: pl } = await sb.from('pipeline').select('etapa').eq('contacto_id', sol.contacto_id).maybeSingle();
    const etapa = pl ? pl.etapa : 'contacto_nuevo';
    await sb.from('pipeline_historial').insert({
      contacto_id: sol.contacto_id, etapa_anterior: etapa, etapa_nueva: etapa,
      comentario: 'Reasignación aprobada por Javier' + (sol.motivo ? ': ' + sol.motivo : ''), usuario_id: currentUser.id
    });
  }
  renderSection('dashboard');
}

async function fetchPipelineFiltrado(){
  const soyCloser = currentUser.rol === 'closer' && !ve_todo(currentUser);
  let q = sb.from('pipeline').select('id, etapa, fecha_cambio_etapa, contacto_id, contactos(nombre, closer_id, telefono, origen)');
  const { data, error } = await q;
  if(error) throw error;
  return soyCloser ? (data||[]).filter(p => p.contactos && p.contactos.closer_id === currentUser.id) : (data||[]);
}

function leadCardHtml(p){
  const nombre = p.contactos ? p.contactos.nombre : 'Sin nombre';
  const nombreEsc = nombre.replace(/'/g,"\\'");
  return `<div class="lead-card">
    <div>${nombre}</div>
    <button onclick="openMoveModal('${p.id}','${p.contacto_id}','${nombreEsc}','${p.etapa}')"
      style="margin-top:4px;font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;">Mover</button>
  </div>`;
}

async function pipelineBoardHtml(){
  const filtrado = await fetchPipelineFiltrado();
  let html = '<div class="pipeline-row">';
  STAGES.forEach(([key,label,color])=>{
    const leads = filtrado.filter(p=>p.etapa===key);
    html += `<div class="stage-col">
      <div class="stage-head" style="background:${color}">${label} (${leads.length})</div>
      <div class="stage-body">`;
    if(leads.length === 0){
      html += `<span style="opacity:.6">Sin leads</span>`;
    } else {
      leads.forEach(l=>{ html += leadCardHtml(l); });
    }
    html += `</div></div>`;
  });
  html += '</div>';
  return html;
}

function openMoveModal(pipelineId, contactoId, contactoNombre, etapaActual){
  moveContext = { pipelineId, contactoId, etapaActual };
  document.getElementById('mm-sub').textContent = contactoNombre;
  const sel = document.getElementById('mm-etapa');
  sel.innerHTML = STAGES.map(([key,label])=>`<option value="${key}" ${key===etapaActual?'selected':''}>${label}</option>`).join('');
  document.getElementById('mm-comentario').value = '';
  document.getElementById('mm-msg').textContent = '';
  document.getElementById('move-modal').style.display = 'flex';
}
function closeMoveModal(){
  document.getElementById('move-modal').style.display = 'none';
  moveContext = null;
}
async function confirmMoverLead(){
  const nuevaEtapa = document.getElementById('mm-etapa').value;
  const comentario = document.getElementById('mm-comentario').value.trim();
  const msg = document.getElementById('mm-msg');
  if(!comentario){ msg.textContent = 'El comentario es obligatorio para registrar el cambio.'; return; }
  if(nuevaEtapa === moveContext.etapaActual){ msg.textContent = 'Elige una etapa distinta a la actual.'; return; }

  const { error: e1 } = await sb.from('pipeline').update({ etapa: nuevaEtapa, fecha_cambio_etapa: new Date().toISOString() }).eq('id', moveContext.pipelineId);
  if(e1){ msg.textContent = 'Error: ' + e1.message; return; }
  const { error: e2 } = await sb.from('pipeline_historial').insert({
    contacto_id: moveContext.contactoId, etapa_anterior: moveContext.etapaActual, etapa_nueva: nuevaEtapa,
    comentario, usuario_id: currentUser.id
  });
  if(e2){ msg.textContent = 'Error al guardar el historial: ' + e2.message; return; }

  closeMoveModal();
  renderSection('pipeline');
}

async function renderContactos(){

  if(soyCloser) q = q.eq('closer_id', currentUser.id);
  const { data, error } = await q;
  if(error) throw error;

  window._contactosCache = data || [];

  const ids = (data||[]).map(c=>c.id);
  let ultimosPorContacto = {};
  if(ids.length){
    const { data: hist } = await sb.from('pipeline_historial')
      .select('contacto_id, comentario, fecha_cambio')
      .in('contacto_id', ids)
      .order('fecha_cambio', {ascending:false});
    (hist||[]).forEach(h=>{

  // lista de closers para el filtro (solo si el usuario ve más de un closer)
  let opcionesFiltroCloser = '';

    (data||[]).forEach(c=>{ if(c.usuarios && c.closer_id) closersUnicos.set(c.closer_id, c.usuarios.nombre); });
    opcionesFiltroCloser = Array.from(closersUnicos.entries()).map(([id,nombre])=>`<option value="${id}">${nombre}</option>`).join('');
  }

  const filtrosHtml = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <input id="ct-buscar" placeholder="Buscar por nombre o teléfono…" oninput="filterContactosTable()"
        style="flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;">
      ${!soyCloser ? `<select id="ct-filtro-closer" onchange="filterContactosTable()" style="padding:9px 12px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;">
        <option value="">Todos los closers</option>${opcionesFiltroCloser}
      </select>` : ''}
      <select id="ct-filtro-estado" onchange="filterContactosTable()" style="padding:9px 12px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;">
        <option value="">Todos los estados</option>
        <option value="activo">Activo</option>
        <option value="cerrado">Cerrado</option>
        <option value="perdido">Perdido</option>
      </select>
    </div>`;

  return `
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 style="margin:0;">Contactos</h3>
        <div style="display:flex;gap:8px;">
          <button onclick="exportContactosCSV()" style="font-size:12.5px;padding:7px 13px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;">Exportar CSV</button>
          <label style="font-size:12.5px;padding:7px 13px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;">
            Importar CSV
            <input type="file" accept=".csv" onchange="importContactosCSV(event)" style="display:none;">
          </label>
        </div>
      </div>
      ${filtrosHtml}
      <table style="width:100%;border-collapse:collapse;font-size:13.5px;">
        <thead>
          <tr style="text-align:left;color:var(--ink-soft);border-bottom:1px solid var(--line);">
            <th style="padding:6px 8px;">Nombre</th><th style="padding:6px 8px;">Teléfono</th>
            <th style="padding:6px 8px;">Tratamiento</th><th style="padding:6px 8px;">Closer</th><th style="padding:6px 8px;">Estado</th>
            <th style="padding:6px 8px;">Último contacto</th>
          </tr>
        </thead>
        <tbody id="ct-tbody">${buildContactosRows(window._contactosCache, ultimosPorContacto)}</tbody>
      </table>
      <div id="ci-msg" style="margin-top:10px;font-size:13px;"></div>
    </div>
    <div class="panel">
      <h3>Añadir contacto</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;">
        <div class="field" style="margin:0;"><label>Nombre</label><input id="nc-nombre"></div>
        <div class="field" style="margin:0;"><label>Teléfono</label><input id="nc-telefono"></div>
        <div class="field" style="margin:0;"><label>Email</label><input id="nc-email"></div>
        <div class="field" style="margin:0;"><label>Tratamiento de interés</label><input id="nc-tratamiento"></div>
      </div>
      <button class="btn-primary" style="max-width:200px;margin-top:6px;" onclick="crearContacto()">Guardar contacto</button>
      <div id="nc-msg" style="margin-top:10px;font-size:13px;"></div>
    </div>
  `;
}

function buildContactosRows(data, ultimosPorContacto){
  const fRel = (iso)=>{
    const d = new Date(iso);
    return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  };
  let rows = (data||[]).map(c => {
    const u = ultimosPorContacto[c.id];
    return `
    <tr>
      <td><button onclick="openContactoDetail('${c.id}')" style="background:none;border:none;padding:0;color:var(--sage-deep);font-weight:600;font-family:inherit;font-size:13.5px;cursor:pointer;text-align:left;">${c.nombre}</button>${c.sugerencias_medico ? ' <span title="Hay sugerencia del médico" style="font-size:11px;">🩺</span>' : ''}</td>
      <td>${c.telefono || '—'}</td>
      <td>${c.tratamiento_interes || '—'}</td>
      <td>${c.usuarios ? c.usuarios.nombre : '—'}</td>
      <td>${c.estado}</td>
      <td style="max-width:220px;">
        ${u ? `<div style="font-size:12.5px;color:var(--ink);">${u.comentario.length>60?u.comentario.slice(0,60)+'…':u.comentario}</div><div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${fRel(u.fecha_cambio)}</div>` : '<span style="color:var(--ink-soft);font-size:12.5px;">Sin actividad</span>'}
      </td>
    </tr>`;
  }).join('');
  if(!rows) rows = `<tr><td colspan="6" style="color:var(--ink-soft);padding:14px 0;">No hay contactos que coincidan con la búsqueda.</td></tr>`;
  return rows;
}

function filterContactosTable(){
  const texto = (document.getElementById('ct-buscar')?.value || '').trim().toLowerCase();
  const closerSel = document.getElementById('ct-filtro-closer')?.value || '';
  const estadoSel = document.getElementById('ct-filtro-estado')?.value || '';

  const filtrado = (window._contactosCache || []).filter(c => {
    if(texto && !((c.nombre||'').toLowerCase().includes(texto) || (c.telefono||'').toLowerCase().includes(texto))) return false;
    if(closerSel && c.closer_id !== closerSel) return false;
    if(estadoSel && c.estado !== estadoSel) return false;
    return true;
  });
  document.getElementById('ct-tbody').innerHTML = buildContactosRows(filtrado, window._ultimosPorContacto || {});
}

function exportContactosCSV(){
  const data = window._contactosCache || [];
  const cabecera = ['nombre','telefono','email','origen','tratamiento_interes','estado','closer'];
  const filas = data.map(c => [
    c.nombre||'', c.telefono||'', c.email||'', c.origen||'', c.tratamiento_interes||'', c.estado||'',
    c.usuarios ? c.usuarios.nombre : ''
  ]);
  const csv = Papa.unparse({ fields: cabecera, data: filas });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'contactos_zeren_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function importContactosCSV(event){
  const file = event.target.files[0];
  if(!file) return;
  const msg = document.getElementById('ci-msg');
  msg.style.color = 'var(--ink-soft)';
  msg.textContent = 'Procesando archivo…';

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: async (results) => {
      const filas = results.data;
      let creados = 0, errores = 0;
      for(const fila of filas){
        const nombre = (fila.nombre || fila.Nombre || '').trim();
        if(!nombre) continue;
        const payload = {
          nombre,
          telefono: (fila.telefono || fila.Telefono || '').trim() || null,
          email: (fila.email || fila.Email || '').trim() || null,
          origen: (fila.origen || fila.Origen || 'Importación CSV').trim() || null,
          tratamiento_interes: (fila.tratamiento_interes || fila.tratamiento || '').trim() || null,
          closer_id: currentUser.rol === 'closer' ? currentUser.id : null,
          estado: 'activo'
        };
        const { data, error } = await sb.from('contactos').insert(payload).select().maybeSingle();
        if(error || !data){ errores++; continue; }
        await sb.from('pipeline').insert({ contacto_id: data.id, etapa: 'contacto_nuevo' });
        await sb.from('pipeline_historial').insert({
          contacto_id: data.id, etapa_anterior: null, etapa_nueva: 'contacto_nuevo',
          comentario: 'Alta por importación CSV', usuario_id: currentUser.id
        });
        creados++;
      }
      msg.style.color = errores ? 'var(--terracotta)' : 'var(--sage-deep)';
      msg.textContent = `Importación completa: ${creados} contacto(s) creados` + (errores ? `, ${errores} con error.` : '.');
      renderSection('contactos');
    },
    error: (err) => {
      msg.style.color = 'var(--terracotta)';
      msg.textContent = 'Error al leer el CSV: ' + err.message;
    }
  });
}

function prepararBloqueTratamientos(c){
  const puedeEditar = currentUser.rol === 'admin' || currentUser.rol === 'medico';
  document.getElementById('cm-tr-msg').textContent = '';

  const campos = [
    { view: 'cm-tr-realizados-view', edit: 'cm-tr-realizados-edit', valor: c.tratamientos_realizados },
    { view: 'cm-tr-proximos-view', edit: 'cm-tr-proximos-edit', valor: c.proximos_tratamientos },
    { view: 'cm-tr-sugerencias-view', edit: 'cm-tr-sugerencias-edit', valor: c.sugerencias_medico }
  ];

  campos.forEach(({view, edit, valor}) => {
    if(puedeEditar){
      document.getElementById(view).style.display = 'none';
      document.getElementById(edit).style.display = 'block';
      document.getElementById(edit).value = valor || '';
    } else {
      document.getElementById(edit).style.display = 'none';
      const v = document.getElementById(view);
      v.style.display = 'block';
      v.textContent = valor || 'Sin información todavía.';
    }
  });

  document.getElementById('cm-tr-guardar-btn').style.display = puedeEditar ? 'inline-block' : 'none';
}

async function cargarTimelineContacto(contactoId){
  const { data: hist } = await sb.from('pipeline_historial')
    .select('etapa_anterior, etapa_nueva, comentario, fecha_cambio, usuarios(nombre)')
    .eq('contacto_id', contactoId)
    .order('fecha_cambio', {ascending:false});

  const box = document.getElementById('cm-timeline');
  if(!hist || hist.length === 0){
    box.innerHTML = '<div style="color:var(--ink-soft);font-size:13.5px;">Sin actividad registrada todavía.</div>';
    return;
  }
  box.innerHTML = hist.map(h=>{
    const mismaEtapa = h.etapa_anterior === h.etapa_nueva;
    const etiqueta = mismaEtapa
      ? `Nota — ${STAGES.find(s=>s[0]===h.etapa_nueva)?.[1] || h.etapa_nueva}`
      : `${h.etapa_anterior ? (STAGES.find(s=>s[0]===h.etapa_anterior)?.[1]||h.etapa_anterior)+' → ' : 'Alta — '}${STAGES.find(s=>s[0]===h.etapa_nueva)?.[1] || h.etapa_nueva}`;
    return `<div style="border-left:2px solid var(--line);padding-left:12px;">
      <div style="font-size:12px;color:var(--sage-deep);font-weight:600;">${etiqueta}</div>
      <div style="font-size:13.5px;color:var(--ink);margin:2px 0;">${h.comentario}</div>
      <div style="font-size:11.5px;color:var(--ink-soft);">${h.usuarios ? h.usuarios.nombre : '—'} · ${new Date(h.fecha_cambio).toLocaleString('es-ES')}</div>
    </div>`;
  }).join('');
}

async function renderEquipo(){
  const pctCloserDefault = await getConfig('comision_closer_default', 15);
  const pctCdvDefault = await getConfig('comision_cdv_default', 15);

  const { data: equipo, error: eqErr } = await sb.from('usuarios')
    .select('id, nombre, rol, es_coordinador, es_gerente, comision_pct, activo')
    .order('rol').order('nombre');
  if(eqErr) throw eqErr;

  const { data: comisiones, error: comErr } = await sb.from('comisiones')
    .select('id, closer_id, venta_valor, pct_closer, pct_cdv, monto_closer, monto_cdv, fecha_venta, estado_pago, contactos(nombre), usuarios(nombre)')
    .order('fecha_venta', {ascending:false});
  if(comErr) throw comErr;

  const inicioMes = new Date(); inicioMes.setDate(1); inicioMes.setHours(0,0,0,0);
  const comisionesMes = (comisiones||[]).filter(c=> new Date(c.fecha_venta) >= inicioMes);
  const pendiente = (comisiones||[]).filter(c=>c.estado_pago==='pendiente').reduce((s,c)=>s+Number(c.monto_cdv||0),0);
  const pagadoMes = (comisiones||[]).filter(c=>c.estado_pago==='pagado' && new Date(c.fecha_venta) >= inicioMes).reduce((s,c)=>s+Number(c.monto_cdv||0),0);
  const nVentasMes = comisionesMes.length;

  const eur = n => Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});

  // agregados por closer para el mes en curso
  const ventasPorCloser = {};
  const comisionPorCloser = {};
  comisionesMes.forEach(c=>{
    ventasPorCloser[c.closer_id] = (ventasPorCloser[c.closer_id]||0) + Number(c.venta_valor||0);
    comisionPorCloser[c.closer_id] = (comisionPorCloser[c.closer_id]||0) + Number(c.monto_closer||0);
  });
  const ventasEquipoTotal = comisionesMes.reduce((s,c)=>s+Number(c.venta_valor||0),0);
  const comisionCdvTotal = comisionesMes.reduce((s,c)=>s+Number(c.monto_cdv||0),0);

  const filasEquipo = (equipo||[]).map(u=>{
    const etiqueta = u.rol === 'admin' ? 'Admin'
      : u.rol === 'medico' ? (u.es_gerente ? 'Médico · Gerente' : 'Médico')
      : (u.es_coordinador ? 'Closer · Coordinador/a' : 'Closer');
    const pct = u.comision_pct != null ? u.comision_pct : (u.rol==='closer' ? pctCloserDefault : null);

    let vendidoTxt = '—', comisionTxt = '—';
    if(u.rol === 'admin'){
      vendidoTxt = eur(ventasEquipoTotal) + ' (equipo)';
      comisionTxt = eur(comisionCdvTotal);
    } else if(u.rol === 'closer'){
      vendidoTxt = eur(ventasPorCloser[u.id] || 0);
      comisionTxt = eur(comisionPorCloser[u.id] || 0);
    }

    const estadoCell = u.rol === 'admin'
      ? (u.activo ? 'Activo' : 'Inactivo')
      : `${u.activo ? 'Activo' : 'Inactivo'}
         <button onclick="toggleActivoUsuario('${u.id}', ${!u.activo})" style="margin-left:8px;font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;">${u.activo ? 'Desactivar' : 'Activar'}</button>`;

      <td>${eur(c.venta_valor)}</td>
      <td>${c.pct_cdv}%</td>
      <td>${eur(c.monto_cdv)}</td>
      <td>${new Date(c.fecha_venta).toLocaleDateString('es-ES')}</td>
      <td>

      </td>
    </tr>`).join('');

  // contactos cerrados-ganados para el desplegable de nueva comisión
  const { data: cerrados } = await sb.from('pipeline')
    .select('contacto_id, contactos(id, nombre, closer_id)')

  const opcionesContactos = (cerrados||[]).map(c=>c.contactos ? `<option value="${c.contactos.id}">${c.contactos.nombre}</option>` : '').join('');

  return `
    <div class="kpi-row">
      <div class="kpi c4"><div class="num">${eur(pendiente)}</div><div class="label">Comisiones pendientes</div></div>
      <div class="kpi c3"><div class="num">${eur(pagadoMes)}</div><div class="label">Pagado este mes</div></div>
      <div class="kpi"><div class="num">${nVentasMes}</div><div class="label">Ventas registradas este mes</div></div>
    </div>

    <div class="panel">
      <h3>Equipo</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13.5px;">
        <thead><tr style="text-align:left;color:var(--ink-soft);border-bottom:1px solid var(--line);">
          <th style="padding:6px 8px;">Nombre</th><th style="padding:6px 8px;">Rol</th>
          <th style="padding:6px 8px;">% Comisión</th>
          <th style="padding:6px 8px;">Vendido este mes</th>
          <th style="padding:6px 8px;">Comisión a pagar</th>
          <th style="padding:6px 8px;">Estado</th>
        </tr></thead>
        <tbody>${filasEquipo || '<tr><td colspan="6">Sin usuarios.</td></tr>'}</tbody>
      </table>

    <div class="panel">
      <h3>Comisiones registradas</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13.5px;">
        <thead><tr style="text-align:left;color:var(--ink-soft);border-bottom:1px solid var(--line);">

      </table>

    <div class="panel">
      <h3>Registrar venta / comisión</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;">
        <div class="field" style="margin:0;"><label>Contacto (cerrado ganado)</label>

          </select>
        </div>
        <div class="field" style="margin:0;"><label>Valor de la venta (€)</label><input id="nv-valor" type="number" step="0.01"></div>
        <div class="field" style="margin:0;"><label>% comisión closer</label><input id="nv-pct-closer" type="number" step="0.01" value="${pctCloserDefault}"></div>
        <div class="field" style="margin:0;"><label>% comisión CDV by JCerezo</label><input id="nv-pct-cdv" type="number" step="0.01" value="${pctCdvDefault}"></div>
      </div>
      <button class="btn-primary" style="max-width:220px;margin-top:6px;" onclick="crearComision()">Registrar comisión</button>
      <div id="nv-msg" style="margin-top:10px;font-size:13px;"></div>
    </div>
  `;
}

async function guardarComisionPctCloser(id){
  const valor = parseFloat(document.getElementById(`pct-inp-${id}`).value);
  if(isNaN(valor)){ alert('Introduce un porcentaje válido.'); return; }
  const { error } = await sb.from('usuarios').update({ comision_pct: valor }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  renderSection('equipo');
}

async function toggleActivoUsuario(id, nuevoEstado){
  const { error } = await sb.from('usuarios').update({ activo: nuevoEstado }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  renderSection('equipo');
}

async function marcarPagado(id){
  const { error } = await sb.from('comisiones').update({ estado_pago: 'pagado' }).eq('id', id);
  if(error){ alert('Error al actualizar: ' + error.message); return; }
  renderSection('equipo');
}

async function crearComision(){
  const contacto_id = document.getElementById('nv-contacto').value;
  const closer_id = document.getElementById('nv-closer').value;
  const venta_valor = parseFloat(document.getElementById('nv-valor').value);
  const pct_closer = parseFloat(document.getElementById('nv-pct-closer').value);
  const pct_cdv = parseFloat(document.getElementById('nv-pct-cdv').value);
  const msg = document.getElementById('nv-msg');

  if(!contacto_id || !closer_id || !venta_valor){
    msg.textContent = 'Selecciona contacto, closer e introduce el valor de la venta.';
    msg.style.color = 'var(--terracotta)';
    return;
  }

  const { error } = await sb.from('comisiones').insert({
    contacto_id, closer_id, venta_valor, pct_closer, pct_cdv,
    mes_liquidacion: new Date().toISOString().slice(0,7)
  });
  if(error){ msg.textContent = 'Error: ' + error.message; msg.style.color = 'var(--terracotta)'; return; }

  msg.textContent = 'Comisión registrada correctamente.';
  msg.style.color = 'var(--sage-deep)';
  renderSection('equipo');
}

// ---------- CALENDARIO ----------
const TIPO_EVENTO_LABEL = {
  visita_comercial: 'Visita comercial',
  procedimiento_medico: 'Procedimiento médico',
  seguimiento: 'Seguimiento',
  otro: 'Otro'
};
const TIPO_EVENTO_COLOR = {
  visita_comercial: 'var(--sage)',
  procedimiento_medico: 'var(--st-contactado)',
  seguimiento: 'var(--st-seguimiento)',
  otro: 'var(--ink-soft)'
};

async function renderCalendario(){
  const esMedicoNormal = currentUser.rol === 'medico' && !currentUser.es_gerente;
  const esCloserNormal = currentUser.rol === 'closer' && !currentUser.es_coordinador;

  let q = sb.from('calendario')
    .select('id, tipo_evento, tipo_evento_descripcion, fecha_hora_inicio, fecha_hora_fin, estado, notas, contactos(nombre), closer:usuarios!calendario_closer_id_fkey(nombre), medico:usuarios!calendario_medico_id_fkey(nombre)')
    .order('fecha_hora_inicio', {ascending:true});

  if(esCloserNormal) q = q.eq('closer_id', currentUser.id);
  if(esMedicoNormal) q = q.eq('medico_id', currentUser.id);

  const { data: eventos, error } = await q;
  if(error) throw error;

  const ahora = new Date();
  const hoyStr = ahora.toDateString();
  const finSemana = new Date(ahora); finSemana.setDate(finSemana.getDate()+7);

  const hoy = (eventos||[]).filter(e=> new Date(e.fecha_hora_inicio).toDateString() === hoyStr && e.estado==='programado').length;
  const semana = (eventos||[]).filter(e=> {
    const f = new Date(e.fecha_hora_inicio);
    return f >= ahora && f <= finSemana && e.estado==='programado';
  }).length;
  const pendientesTotal = (eventos||[]).filter(e=>e.estado==='programado').length;

  const filas = (eventos||[]).map(e=>{
    const f = new Date(e.fecha_hora_inicio);
    const color = TIPO_EVENTO_COLOR[e.tipo_evento] || 'var(--ink-soft)';
    const tipoTexto = e.tipo_evento === 'otro' && e.tipo_evento_descripcion
      ? `Otro — ${e.tipo_evento_descripcion}` : TIPO_EVENTO_LABEL[e.tipo_evento];
    const estadoTexto = e.estado === 'programado' ? 'Programado' : e.estado === 'completado' ? 'Completado' : 'Cancelado';
    const acciones = e.estado === 'programado'
      ? `<button onclick="cambiarEstadoEvento('${e.id}','completado')" style="font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;margin-right:4px;">Completar</button>
         <button onclick="cambiarEstadoEvento('${e.id}','cancelado')" style="font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;">Cancelar</button>`
      : `<span style="color:var(--ink-soft);">—</span>`;
    return `<tr style="border-left:3px solid ${color};">
      <td style="padding:8px;border-left:3px solid ${color};">${f.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})} · ${f.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</td>
      <td style="padding:8px;">${tipoTexto}</td>
      <td style="padding:8px;">${e.contactos ? e.contactos.nombre : '—'}</td>
      <td style="padding:8px;">${e.closer ? e.closer.nombre : '—'}</td>
      <td style="padding:8px;">${e.medico ? e.medico.nombre : '—'}</td>
      <td style="padding:8px;">${estadoTexto}</td>
      <td style="padding:8px;">${acciones}</td>
    </tr>`;
  }).join('');

  // datos para el formulario
  const soyCloser = currentUser.rol === 'closer';
  let contactosQ = sb.from('contactos').select('id, nombre, closer_id').eq('estado','activo');
  if(esCloserNormal) contactosQ = contactosQ.eq('closer_id', currentUser.id);
  const { data: contactos } = await contactosQ;
  const opcionesContactos = (contactos||[]).map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');

  const { data: closers } = await sb.from('usuarios').select('id, nombre').eq('rol','closer').eq('activo', true);
  const opcionesClosers = (closers||[]).map(u=>`<option value="${u.id}" ${u.id===currentUser.id?'selected':''}>${u.nombre}</option>`).join('');

  const { data: medicos } = await sb.from('usuarios').select('id, nombre').eq('rol','medico').eq('activo', true);
  const opcionesMedicos = (medicos||[]).map(u=>`<option value="${u.id}" ${u.id===currentUser.id?'selected':''}>${u.nombre}</option>`).join('');

  return `
    <div class="kpi-row">
      <div class="kpi"><div class="num">${hoy}</div><div class="label">Eventos hoy</div></div>
      <div class="kpi c2"><div class="num">${semana}</div><div class="label">Próximos 7 días</div></div>
      <div class="kpi c3"><div class="num">${pendientesTotal}</div><div class="label">Total programados</div></div>
    </div>

    <div class="panel">
      <h3>Agenda</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="text-align:left;color:var(--ink-soft);border-bottom:1px solid var(--line);">

          <th style="padding:8px;">Closer</th><th style="padding:8px;">Médico</th><th style="padding:8px;">Estado</th><th style="padding:8px;">Acciones</th>
        </tr></thead>
        <tbody>${filas || '<tr><td colspan="7" style="color:var(--ink-soft);padding:14px 8px;">No hay eventos todavía.</td></tr>'}</tbody>
      </table>
    </div>

    <div class="panel">
      <h3>Nuevo evento</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;">
        <div class="field" style="margin:0;"><label>Tipo de evento</label>
          <select id="ne-tipo" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:3px;font-family:inherit;" onchange="document.getElementById('ne-otro-wrap').style.display = this.value==='otro' ? 'block' : 'none';">
            <option value="visita_comercial">Visita comercial</option>
            <option value="procedimiento_medico">Procedimiento médico</option>
            <option value="seguimiento">Seguimiento</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="field" style="margin:0;"><label>Contacto (opcional)</label>
          <select id="ne-contacto" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:3px;font-family:inherit;">
            <option value="">— Ninguno —</option>${opcionesContactos}
          </select>
        </div>
        <div class="field" style="margin:0;"><label>Closer</label>
          <select id="ne-closer" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:3px;font-family:inherit;">
            <option value="">— Ninguno —</option>${opcionesClosers}
          </select>
        </div>
        <div class="field" style="margin:0;"><label>Médico</label>
          <select id="ne-medico" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:3px;font-family:inherit;">
            <option value="">— Ninguno —</option>${opcionesMedicos}
          </select>
        </div>
        <div class="field" style="margin:0;"><label>Fecha y hora de inicio</label><input id="ne-inicio" type="datetime-local"></div>
        <div class="field" style="margin:0;"><label>Fecha y hora de fin (opcional)</label><input id="ne-fin" type="datetime-local"></div>
      </div>
      <div class="field" id="ne-otro-wrap" style="display:none;max-width:600px;">
        <label>Describe el tipo de evento</label><input id="ne-otro-desc" placeholder="Obligatorio si el tipo es 'Otro'">
      </div>
      <div class="field" style="max-width:600px;"><label>Notas</label><input id="ne-notas"></div>
      <button class="btn-primary" style="max-width:200px;margin-top:6px;" onclick="crearEvento()">Guardar evento</button>
      <div id="ne-msg" style="margin-top:10px;font-size:13px;"></div>
    </div>
  `;
}

async function cambiarEstadoEvento(id, estado){
  const { error } = await sb.from('calendario').update({ estado }).eq('id', id);
  if(error){ alert('Error: ' + error.message); return; }
  renderSection('calendario');
}

async function crearEvento(){
  const tipo_evento = document.getElementById('ne-tipo').value;
  const tipo_evento_descripcion = document.getElementById('ne-otro-desc').value.trim();
  const contacto_id = document.getElementById('ne-contacto').value || null;
  const closer_id = document.getElementById('ne-closer').value || null;
  const medico_id = document.getElementById('ne-medico').value || null;
  const inicio = document.getElementById('ne-inicio').value;
  const fin = document.getElementById('ne-fin').value;
  const notas = document.getElementById('ne-notas').value.trim();
  const msg = document.getElementById('ne-msg');

  if(!inicio){ msg.textContent = 'La fecha y hora de inicio es obligatoria.'; msg.style.color = 'var(--terracotta)'; return; }
  if(tipo_evento === 'otro' && !tipo_evento_descripcion){
    msg.textContent = 'Describe el tipo de evento cuando eliges "Otro".';
    msg.style.color = 'var(--terracotta)';
    return;
  }

  const payload = {
    tipo_evento,
    tipo_evento_descripcion: tipo_evento === 'otro' ? tipo_evento_descripcion : null,
    contacto_id, closer_id, medico_id,
    fecha_hora_inicio: new Date(inicio).toISOString(),
    fecha_hora_fin: fin ? new Date(fin).toISOString() : null,
    notas: notas || null
  };
  const { error } = await sb.from('calendario').insert(payload);
  if(error){ msg.textContent = 'Error: ' + error.message; msg.style.color = 'var(--terracotta)'; return; }

  msg.textContent = 'Evento guardado correctamente.';
  msg.style.color = 'var(--sage-deep)';
  renderSection('calendario');
}

// ---------- CONFIGURACIÓN ----------

  const pctCloser = await getConfig('comision_closer_default', 15);
  const pctCdv = await getConfig('comision_cdv_default', 15);

  return `
    <div class="panel">
      <h3>Comisiones por defecto</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-8px;margin-bottom:16px;">
        Estos porcentajes se usan como valor inicial al registrar una venta nueva en "Equipo & Finanzas" — siempre se pueden ajustar venta a venta.
      </p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;">
        <div class="field" style="margin:0;"><label>% Comisión Closer</label><input id="cfg-pct-closer" type="number" step="0.01" value="${pctCloser}"></div>
        <div class="field" style="margin:0;"><label>% Comisión CDV by JCerezo</label><input id="cfg-pct-cdv" type="number" step="0.01" value="${pctCdv}"></div>
      </div>
      <button class="btn-primary" style="max-width:200px;margin-top:6px;" onclick="guardarComisionesDefault()">Guardar</button>
      <div id="cfg-msg" style="margin-top:10px;font-size:13px;"></div>
    </div>

    <div class="panel">
      <h3>Añadir nuevo usuario</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;">
        <div class="field" style="margin:0;"><label>Nombre</label><input id="nu-nombre"></div>
        <div class="field" style="margin:0;"><label>Email</label><input id="nu-email" type="email"></div>
        <div class="field" style="margin:0;"><label>Contraseña</label><input id="nu-clave" type="text" placeholder="Ej: zeren2026"></div>
        <div class="field" style="margin:0;"><label>Rol</label>
          <select id="nu-rol" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:3px;font-family:inherit;" onchange="actualizarCamposRolNuevoUsuario()">
            <option value="closer">Closer</option>
            <option value="medico">Médico</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div id="nu-flag-coordinador" class="field" style="max-width:560px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);">
          <input type="checkbox" id="nu-es-coordinador" style="width:auto;"> Es coordinador/a (ve a todos los closers y al médico)
        </label>
      </div>
      <div id="nu-flag-gerente" class="field" style="display:none;max-width:560px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);">
          <input type="checkbox" id="nu-es-gerente" style="width:auto;"> Es gerente (ve leads, pipeline y cierres además de su agenda)
        </label>
      </div>
      <button class="btn-primary" style="max-width:200px;margin-top:6px;" onclick="crearUsuario()">Crear usuario</button>
      <div id="nu-msg" style="margin-top:10px;font-size:13px;"></div>
    </div>
  `;
}

function actualizarCamposRolNuevoUsuario(){
  const rol = document.getElementById('nu-rol').value;
  document.getElementById('nu-flag-coordinador').style.display = rol === 'closer' ? 'block' : 'none';
  document.getElementById('nu-flag-gerente').style.display = rol === 'medico' ? 'block' : 'none';
}

async function guardarComisionesDefault(){
  const pctCloser = parseFloat(document.getElementById('cfg-pct-closer').value);
  const pctCdv = parseFloat(document.getElementById('cfg-pct-cdv').value);
  const msg = document.getElementById('cfg-msg');
  if(isNaN(pctCloser) || isNaN(pctCdv)){ msg.textContent = 'Introduce valores numéricos válidos.'; msg.style.color = 'var(--terracotta)'; return; }

  const e1 = await sb.from('configuracion').update({ valor: String(pctCloser), actualizado_en: new Date().toISOString() }).eq('clave','comision_closer_default');
  const e2 = await sb.from('configuracion').update({ valor: String(pctCdv), actualizado_en: new Date().toISOString() }).eq('clave','comision_cdv_default');
  if(e1.error || e2.error){ msg.textContent = 'Error: ' + (e1.error?.message || e2.error?.message); msg.style.color = 'var(--terracotta)'; return; }

  msg.textContent = 'Guardado correctamente.';
  msg.style.color = 'var(--sage-deep)';
}

async function crearUsuario(){
  const nombre = document.getElementById('nu-nombre').value.trim();
  const email = document.getElementById('nu-email').value.trim().toLowerCase();
  const clave = document.getElementById('nu-clave').value.trim();
  const rol = document.getElementById('nu-rol').value;
  const es_coordinador = rol === 'closer' && document.getElementById('nu-es-coordinador').checked;
  const es_gerente = rol === 'medico' && document.getElementById('nu-es-gerente').checked;
  const msg = document.getElementById('nu-msg');

  if(!nombre || !email || !clave){ msg.textContent = 'Nombre, email y contraseña son obligatorios.'; msg.style.color = 'var(--terracotta)'; return; }

  const { error } = await sb.from('usuarios').insert({ nombre, email, clave, rol, es_coordinador, es_gerente, activo: true });
  if(error){ msg.textContent = 'Error: ' + error.message; msg.style.color = 'var(--terracotta)'; return; }

  msg.textContent = `Usuario "${nombre}" creado correctamente.`;
  msg.style.color = 'var(--sage-deep)';
  document.getElementById('nu-nombre').value = '';
  document.getElementById('nu-email').value = '';
  document.getElementById('nu-clave').value = '';
}

function logout(){
  currentUser = null;
  localStorage.removeItem('zeren_session');
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('email').value = '';
  document.getElementById('pass').value = '';
}
</script>
